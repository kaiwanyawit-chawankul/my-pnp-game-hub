<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Glow: Firefly Collecting Game - Card Backs (Ink Saver Version)</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 0;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .page {
            width: 210mm;
            height: 297mm;
            box-sizing: border-box;
            padding: 10mm 15mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 60mm);
            grid-template-rows: repeat(3, 88mm);
            gap: 0; /* Aligned back-to-back precisely */
            border: 1px dashed #bbbbbb;
        }
        .card-back {
            width: 60mm;
            height: 88mm;
            box-sizing: border-box;
            border: 1px dashed #bbbbbb;
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* Minimalist Ink-Saver Pattern: Thin elegant cross-hatch/stars with clean vector logo */
        .pattern-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.15;
            background-image: 
                radial-gradient(#333 1px, transparent 1px),
                radial-gradient(#333 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            pointer-events: none;
        }
        .logo-container {
            text-align: center;
            z-index: 1;
            padding: 10px;
        }
        .logo-title {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #111111;
            margin: 0;
            font-family: 'Arial Black', Impact, sans-serif;
        }
        .logo-subtitle {
            font-size: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #444444;
            margin: 4px 0 0 0;
        }
        .art-icon {
            width: 40px;
            height: 40px;
            margin-bottom: 5px;
        }
    </style>
</head>

                        <circle cx="12" cy="12" r="4" fill="none"/>
